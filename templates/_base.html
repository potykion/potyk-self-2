<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>potyk-self-2</title>
    <style>
        body {
            max-width: 700px;
            margin: auto;
            font-family: "Rubik", system-ui;
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block style %}
    {% endblock %}
</head>
<body style="display: flex; flex-direction: column; height: 100vh;">
<main style="margin-top: {{ margin_top or '5px' }}; flex-grow: 1">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    {% block main %}
    {% endblock %}
</main>
<footer style="text-align: center; padding-bottom: 10px; padding-top: 10px; ">
    <hr >
    <small>
        <a href="https://github.com/potykion/potyk-self-2">GitHub</a>
    </small>
</footer>

</body>
</html>
