<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>potyk-self-2</title>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block style %}
    {% endblock %}
</head>
<body class="app-layout">
<main class="app-main" style="margin-top: {{ margin_top or '5px' }};">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    {% block main %}
    {% endblock %}
</main>
<footer class="app-footer">
    <hr>
    <small>

        <div class="footer-row">
            <a href="https://github.com/potykion/potyk-self-2">GitHub</a>
            <div class="theme-switcher">
                <label for="theme-mode">Тема:</label>
                <select id="theme-mode" aria-label="Выбор темы">
                    <option value="system">Системная</option>
                    <option value="light">Светлая</option>
                    <option value="dark">Темная</option>
                </select>
            </div>

        </div>
    </small>
            
</footer>

<script>
    const themeModeSelect = document.getElementById("theme-mode");
    const savedThemeMode = localStorage.getItem("theme-mode");
    const initialThemeMode = savedThemeMode || "system";

    const applyThemeMode = (mode) => {
        document.documentElement.setAttribute("data-theme", mode);
        localStorage.setItem("theme-mode", mode);
        themeModeSelect.value = mode;
    };

    applyThemeMode(initialThemeMode);

    themeModeSelect.addEventListener("change", (event) => {
        applyThemeMode(event.target.value);
    });
</script>
</body>
</html>
